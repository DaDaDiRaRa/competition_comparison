name: Deploy to Cloud Run

# 수동 실행 전용 (workflow_dispatch).
# push 자동 실행을 끈 이유:
#   - GCP_SA_KEY 시크릿이 현재 competition-comparison 프로젝트를 가리키고 있어
#     push할 때마다 잘못된 프로젝트에 설정 없는 빈 서비스가 재배포됨.
#   - SA 키를 arch-diagnose 프로젝트의 키로 교체한 후 push 트리거로 되돌릴 것.
on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push image
        run: |
          gcloud builds submit \
            --tag asia-northeast3-docker.pkg.dev/arch-diagnose/competition-analyzer/app \
            --project arch-diagnose \
            .

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy competition-analyzer \
            --image asia-northeast3-docker.pkg.dev/arch-diagnose/competition-analyzer/app \
            --region asia-northeast3 \
            --project arch-diagnose \
            --execution-environment gen2 \
            --add-volume name=db,type=cloud-storage,bucket=kunwon-competition-db \
            --add-volume-mount volume=db,mount-path=/data \
            --set-env-vars DB_PATH=/data,PYTHONUNBUFFERED=1 \
            --set-secrets ANTHROPIC_API_KEY=anthropic-api-key:latest \
            --memory 2Gi \
            --cpu 2 \
            --timeout 3600 \
            --max-instances 1 \
            --allow-unauthenticated